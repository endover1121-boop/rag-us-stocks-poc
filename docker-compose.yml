
version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
  rag-app:
    build: ./app
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Tokyo
      - HF_HOME=/models/hf_cache
    volumes:
      - ./data/models:/models/hf_cache
    depends_on:
      - qdrant
